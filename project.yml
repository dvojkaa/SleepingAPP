name: SleepTracker
options:
  bundleIdPrefix: com.kratina.vojta
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

targets:
  SleepTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SleepTracker
    info:
      path: Generated/SleepTracker-Info.plist
      properties:
        CFBundleDisplayName: "SleepTracker"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "SleepTracker potřebuje přístup k mikrofonu, aby mohl přes noc nahrávat a rozpoznávat zvuky jako chrápání nebo mluvení ze spánku. Zvuk zůstává jen v telefonu."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: SleepTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.kratina.vojta.SleepTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
